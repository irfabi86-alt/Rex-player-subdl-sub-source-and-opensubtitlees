name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source ZIP
        id: extract
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan di repository."
            exit 1
          fi

          echo "Mengekstrak: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          GRADLEW_FILE="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW_FILE" ]; then
            echo "ERROR: gradlew tidak ditemukan setelah ZIP diekstrak."
            echo "Pastikan ZIP berisi source project Android lengkap."
            find extracted -maxdepth 3 -type f | head -n 50
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Folder project ditemukan: $PROJECT_DIR"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
